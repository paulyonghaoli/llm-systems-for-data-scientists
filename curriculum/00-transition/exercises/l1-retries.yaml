id: tr-l1-retries
title: "What retries actually cost"
lesson: modules/00-transition/01-what-changes
description: |
  A bounded retry policy: try up to `max_attempts` times, give up after that.
  Work the arithmetic out rather than guessing it — the answer contains a
  cancellation most people do not expect, and it changes which lever you pull.

  With failure rate `f` and limit `K`:

  - **attempts per request** — expected attempts spent on a request, whether
    or not it ends up succeeding, `(1 - f**K) / (1 - f)`
  - **success rate** — `1 - f**K`
  - **attempts per success** — the first divided by the second

setup_code: |
  pass

starter_code: |
  def retry_economics(fail_rate, max_attempts):
      """Return {"attempts_per_request", "success_rate", "attempts_per_success"}."""
      f = fail_rate
      attempts_per_request = (1 - f ** max_attempts) / (1 - f) if f < 1 else max_attempts
      success_rate = 1 - f ** max_attempts
      return {
          "attempts_per_request": attempts_per_request,
          "success_rate": success_rate,
          "attempts_per_success": attempts_per_request,
      }


  for k in (1, 3, 10):
      e = retry_economics(0.20, k)
      print(f"K={k:>2}  cost/success {e['attempts_per_success']:.3f}  "
            f"success {e['success_rate']:.4f}")

tests: |
  def close(a, b, tol=1e-9):
      return abs(a - b) < tol

  e = retry_economics(0.0, 3)
  assert close(e["attempts_per_request"], 1.0)
  assert close(e["success_rate"], 1.0)
  assert close(e["attempts_per_success"], 1.0), "with no failures, one attempt per success"

  e = retry_economics(0.5, 1)
  assert close(e["attempts_per_request"], 1.0), "one attempt allowed means one attempt spent"
  assert close(e["success_rate"], 0.5)
  assert close(e["attempts_per_success"], 2.0), (
      f"got {e['attempts_per_success']}. One attempt is spent per request and half "
      "of them succeed, so each SUCCESS costs two attempts. Attempts per success is "
      "attempts_per_request divided by success_rate, not attempts_per_request."
  )

  e = retry_economics(0.20, 3)
  assert close(e["attempts_per_request"], 1.24)
  assert close(e["success_rate"], 0.992)
  assert close(e["attempts_per_success"], 1.25)

  # The cancellation. K vanishes from cost per success entirely.
  for k in (1, 2, 3, 5, 10, 50):
      e = retry_economics(0.20, k)
      assert close(e["attempts_per_success"], 1.25), (
          f"at K={k} you got {e['attempts_per_success']:.4f}, expected 1.25. "
          "attempts_per_success = ((1-f**K)/(1-f)) / (1-f**K) = 1/(1-f), and the "
          "K cancels: raising the retry limit does not change what a successful "
          "request costs. It buys success rate and tail latency, nothing else."
      )

  # ...while the success rate does depend on K, which is the point of retrying.
  assert retry_economics(0.20, 10)["success_rate"] > retry_economics(0.20, 3)["success_rate"]

  # And cost per success is set entirely by the failure rate.
  for f in (0.05, 0.10, 0.25, 0.50):
      assert close(retry_economics(f, 4)["attempts_per_success"], 1 / (1 - f))

hints:
  - "Only one of the three returned values is wrong in the starter."
  - "Read the definition again: attempts per SUCCESS divides the attempts spent by the fraction of requests that succeed."
  - "Once it is right, run the printout at the bottom and watch what happens to cost per success as K grows."

solution: |
  def retry_economics(fail_rate, max_attempts):
      f = fail_rate
      attempts_per_request = (1 - f ** max_attempts) / (1 - f) if f < 1 else max_attempts
      success_rate = 1 - f ** max_attempts
      return {
          "attempts_per_request": attempts_per_request,
          "success_rate": success_rate,
          "attempts_per_success": (
              attempts_per_request / success_rate if success_rate > 0 else float("inf")
          ),
      }


  for k in (1, 3, 10):
      e = retry_economics(0.20, k)
      print(f"K={k:>2}  cost/success {e['attempts_per_success']:.3f}  "
            f"success {e['success_rate']:.4f}")
