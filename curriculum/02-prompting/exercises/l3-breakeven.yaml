id: prm-l3-breakeven
title: "Does decomposition pay?"
lesson: modules/02-prompting/03-decomposition
description: |
  A chain of `n` steps, each correct with probability `q`, succeeds with
  probability `q ** n`. So replacing one step of accuracy `p` with a chain of
  `n` steps is only worth it when

  ```
  q ** n  >  p        i.e.        q  >  p ** (1 / n)
  ```

  Implement `chain_accuracy`, `breakeven_step_accuracy`, and
  `decomposition_pays`, which decides whether a proposed split is worth making.

  The root is the part that surprises people: `0.70 ** (1/3)` is 0.888, not
  something in the seventies. Splitting a step three ways demands nearly
  nineteen extra points of per-step accuracy before it breaks even.

setup_code: |
  def approx(a, b, tol=1e-9):
      """True when two probabilities agree to within tol."""
      return abs(a - b) < tol

starter_code: |
  def chain_accuracy(q, n):
      """End-to-end accuracy of n independent steps each correct with prob q."""
      return q * n


  def breakeven_step_accuracy(p, n):
      """Per-step accuracy a chain of n steps needs to match one step at p."""
      return p / n


  def decomposition_pays(p, n, q):
      """True if splitting a step of accuracy p into n steps of accuracy q wins."""
      return q > p


  for n in (2, 3, 5):
      print(f"n={n}: break-even {breakeven_step_accuracy(0.70, n):.3f}"
            f"   chain of 0.90 steps -> {chain_accuracy(0.90, n):.3f}")

tests: |
  # A chain multiplies. Three 90% steps are not 270% and not 90%.
  assert approx(chain_accuracy(0.9, 1), 0.9), (
      f"chain_accuracy(0.9, 1) = {chain_accuracy(0.9, 1)}, expected 0.9 — a "
      "chain of one step is that step"
  )
  assert approx(chain_accuracy(0.9, 2), 0.81), (
      f"chain_accuracy(0.9, 2) = {chain_accuracy(0.9, 2)}, expected 0.81. Two "
      "steps that each work 90% of the time both work 0.9 * 0.9 of the time. "
      "A result above 1 is a sign the steps are being added or multiplied by "
      "n rather than multiplied together."
  )
  assert approx(chain_accuracy(0.9, 3), 0.729), (
      f"chain_accuracy(0.9, 3) = {chain_accuracy(0.9, 3)}, expected 0.729. "
      "Independent steps multiply, so three 90% steps give 0.9 * 0.9 * 0.9 — "
      "which is worse end to end than a single 75% step."
  )
  assert chain_accuracy(0.9, 10) < 0.35, "ten 90% steps is well under half"

  # A chain of one step is that step, whatever n-handling you wrote.
  for q in (0.3, 0.7, 0.95):
      assert approx(chain_accuracy(q, 1), q)

  # Break-even is the nth root, and it is much closer to 1 than p is.
  assert approx(breakeven_step_accuracy(0.7, 1), 0.7)
  assert approx(breakeven_step_accuracy(0.7, 2), 0.7 ** 0.5)
  assert 0.887 < breakeven_step_accuracy(0.7, 3) < 0.889, (
      f"breakeven_step_accuracy(0.7, 3) = {breakeven_step_accuracy(0.7, 3):.4f}, "
      "expected about 0.888. Splitting a 70% step three ways needs each new "
      "step at nearly 89% merely to break even, because the accuracies "
      "multiply rather than average."
  )
  assert breakeven_step_accuracy(0.7, 5) > breakeven_step_accuracy(0.7, 3), (
      "longer chains demand MORE per step, not less"
  )

  # Round-trip: a chain built at exactly the break-even accuracy matches p.
  for p in (0.5, 0.7, 0.9):
      for n in (2, 3, 5):
          assert approx(chain_accuracy(breakeven_step_accuracy(p, n), n), p)

  # The decision function has to compare against the break-even, not against p.
  assert decomposition_pays(0.70, 3, 0.95) is True, "0.95 ** 3 = 0.857 > 0.70"
  assert decomposition_pays(0.70, 3, 0.80) is False, (
      "decomposition_pays(0.70, 3, 0.80) returned True. Three 80% steps give "
      "0.512 end to end, which is far worse than the single 70% step being "
      "replaced — even though 80% is 'better than 70%' step by step. That "
      "comparison is the trap."
  )
  assert decomposition_pays(0.70, 2, 0.85) is True, "0.85 ** 2 = 0.7225 > 0.70"
  assert decomposition_pays(0.70, 2, 0.83) is False, "0.83 ** 2 = 0.6889 < 0.70"

  # No split at all is never an improvement over itself.
  assert decomposition_pays(0.7, 1, 0.7) is False

hints:
  - "`chain_accuracy` multiplies the step accuracies together: that is `q ** n`, not `q * n`."
  - "`breakeven_step_accuracy` inverts it — the nth root, `p ** (1 / n)`."
  - "`decomposition_pays` must compare `q` against the break-even for that n, or equivalently compare `chain_accuracy(q, n)` against `p`."

solution: |
  def chain_accuracy(q, n):
      return q ** n


  def breakeven_step_accuracy(p, n):
      return p ** (1 / n)


  def decomposition_pays(p, n, q):
      return chain_accuracy(q, n) > p


  for n in (2, 3, 5):
      print(f"n={n}: break-even {breakeven_step_accuracy(0.70, n):.3f}"
            f"   chain of 0.90 steps -> {chain_accuracy(0.90, n):.3f}")
