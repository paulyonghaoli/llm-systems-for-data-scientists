id: ret-l1-cone
title: "Calibrate a threshold instead of guessing one"
lesson: modules/03-retrieval/01-embedding-geometry
description: |
  `similarity > 0.8` is the most common relevance filter in production
  retrieval code, and on a real embedding model it fails in both directions at
  once.

  The lists below are measured from the fixture in
  `data/fixtures/embeddings/`. `QUERY_SIMS` holds one real query's similarity
  to its eight best-matching documents, with the correct answer at index 2.
  `QUERY_DOC_BACKGROUND` holds similarities between a random query and a random
  document, and `DOC_DOC_BACKGROUND` between two random documents.

  Run the starter. A fixed 0.8 cutoff selects **nothing** from the query
  results, because query-to-document scores live around 0.65, and **29 of 40**
  random document pairs, because document-to-document scores live around 0.84.
  One constant, two opposite failures, no error raised in either case.

  Replace it with a rule containing no constant: score each candidate by where
  it falls in a background distribution of scores *of the same kind*. That
  transfers between the two regimes, because the data supplies the scale
  instead of you.

  Then read the last assertion carefully, because it is the real result. The
  correct answer for this query sits at the **40th percentile** of the
  background — a genuinely relevant document scoring below a median pairing of
  unrelated text. Calibration did not fix that. It made it visible, which the
  raw score of 0.637 did not. Everything the rest of this module adds exists
  because of numbers like this one.

setup_code: |
  # One real query's similarity to its top eight documents. The gold document
  # is at index 2. Query: "how much are you actually on the hook for if you
  # lose my stuff"; gold: policy-insurance-v1.
  QUERY_SIMS = [0.698, 0.639, 0.637, 0.631, 0.631, 0.630, 0.630, 0.629]
  GOLD_INDEX = 2

  # 40 similarities between a random query and a random document.
  QUERY_DOC_BACKGROUND = [
      0.592, 0.641, 0.580, 0.647, 0.587, 0.763, 0.646, 0.658, 0.690, 0.573,
      0.659, 0.554, 0.792, 0.572, 0.631, 0.695, 0.602, 0.705, 0.607, 0.628,
      0.736, 0.669, 0.578, 0.721, 0.743, 0.573, 0.672, 0.654, 0.657, 0.664,
      0.625, 0.569, 0.525, 0.776, 0.786, 0.637, 0.531, 0.742, 0.685, 0.758,
  ]

  # 40 similarities between two random documents. Note where these sit.
  DOC_DOC_BACKGROUND = [
      0.806, 0.834, 0.824, 0.952, 0.762, 0.962, 0.941, 0.921, 0.895, 0.723,
      0.702, 0.781, 0.930, 0.938, 0.827, 0.939, 0.963, 0.720, 0.735, 0.865,
      0.692, 0.826, 0.963, 0.697, 0.814, 0.945, 0.791, 0.843, 0.740, 0.812,
      0.821, 0.921, 0.901, 0.808, 0.919, 0.949, 0.831, 0.840, 0.702, 0.815,
  ]

  def absolute_filter(sims, cutoff=0.8):
      """Select every index whose similarity exceeds a fixed cutoff.

      The thing this exercise replaces. Kept so the tests can show it failing
      on both distributions from the same constant.
      """
      return [i for i, s in enumerate(sims) if s > cutoff]

starter_code: |
  def percentile_of(value, background):
      """What fraction of `background` this value exceeds, as a percentage."""
      # Bug: compares against the mean instead of counting the distribution.
      # A mean says nothing about where in the spread a value sits, so this
      # collapses to a two-way split and cannot express "top 30 per cent".
      return 100.0 if value > sum(background) / len(background) else 0.0


  def shortlist(sims, background, min_percentile=70.0):
      """Indices scoring above `min_percentile` of the background, best first."""
      keep = [i for i, s in enumerate(sims)
              if percentile_of(s, background) >= min_percentile]
      return sorted(keep, key=lambda i: sims[i], reverse=True)


  print("absolute 0.8, query results :", absolute_filter(QUERY_SIMS))
  print("absolute 0.8, document pairs:", len(absolute_filter(DOC_DOC_BACKGROUND)), "of 40")
  print("calibrated,   query results :", shortlist(QUERY_SIMS, QUERY_DOC_BACKGROUND))
  print("gold percentile             :",
        percentile_of(QUERY_SIMS[GOLD_INDEX], QUERY_DOC_BACKGROUND))

tests: |
  # The failure being replaced, in both directions, from one constant.
  assert absolute_filter(QUERY_SIMS) == [], (
      "a 0.8 cutoff should select nothing from these query results — that is "
      "half the point of the exercise"
  )
  assert len(absolute_filter(DOC_DOC_BACKGROUND)) >= 25, (
      "a 0.8 cutoff should admit most random document pairs — the same "
      "constant, the opposite failure"
  )

  # percentile_of must describe position in the distribution, not a side of it.
  mid = percentile_of(0.659, QUERY_DOC_BACKGROUND)
  assert abs(mid - 57.5) < 0.01, (
      f"percentile_of(0.659, QUERY_DOC_BACKGROUND) returned {mid}, expected "
      "57.5 — 23 of the 40 background values are below 0.659. A comparison "
      "against the mean can only ever return 0 or 100."
  )
  assert percentile_of(0.525, QUERY_DOC_BACKGROUND) == 0.0, (
      "the smallest background value beats nothing, so it should score 0"
  )
  assert percentile_of(0.99, QUERY_DOC_BACKGROUND) == 100.0, (
      "a value above everything in the background should score 100"
  )

  # One parameter, two regimes. This is what a constant cannot do: the rule
  # keeps a sensible fraction of each distribution without being retuned.
  assert shortlist(QUERY_SIMS, QUERY_DOC_BACKGROUND, 70.0) == [0], (
      f"expected only index 0 above the 70th percentile, got "
      f"{shortlist(QUERY_SIMS, QUERY_DOC_BACKGROUND, 70.0)}"
  )
  pairs = shortlist(DOC_DOC_BACKGROUND, DOC_DOC_BACKGROUND, 70.0)
  assert len(pairs) == 12, (
      f"selected {len(pairs)} of 40 document pairs at the 70th percentile, "
      "expected 12. The same threshold that kept one of eight query results "
      "keeps the top 30% here, because the background supplies the scale."
  )

  # The result worth remembering.
  gold_pct = percentile_of(QUERY_SIMS[GOLD_INDEX], QUERY_DOC_BACKGROUND)
  assert gold_pct < 50.0, (
      f"the gold document scored at the {gold_pct}th percentile of the "
      "background. Below the median. A raw similarity of 0.637 looked "
      "unremarkable and this says why: on this model the correct answer for "
      "this query is less similar to it than a coin-flip pairing of unrelated "
      "text. No threshold, calibrated or not, separates that."
  )

hints:
  - "A percentile is a count, not a comparison: how many background values does this one beat?"
  - "`sum(1 for b in background if b < value) / len(background) * 100`"
  - "Once `percentile_of` is right the rest already works — the bug is only in the first function."

solution: |
  def percentile_of(value, background):
      """What fraction of `background` this value exceeds, as a percentage."""
      below = sum(1 for b in background if b < value)
      return 100.0 * below / len(background)


  def shortlist(sims, background, min_percentile=70.0):
      """Indices scoring above `min_percentile` of the background, best first."""
      keep = [i for i, s in enumerate(sims)
              if percentile_of(s, background) >= min_percentile]
      return sorted(keep, key=lambda i: sims[i], reverse=True)
