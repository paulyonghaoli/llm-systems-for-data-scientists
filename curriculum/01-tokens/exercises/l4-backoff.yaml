id: tok-l4-backoff
title: "Backoff with full jitter"
lesson: modules/01-tokens/04-api-contract
description: |
  Implement `delay_ms(attempt, base, cap, rng)` for **full-jitter** exponential
  backoff:

  ```
  bound = min(cap, base * 2 ** (attempt - 1))
  delay = uniform(0, bound)
  ```

  Uniform over the *whole* interval, not a small wobble around the bound. A
  ±10% perturbation of a common value is still a common value, and the point
  of jitter is that clients which collided stop being synchronised.

  Then `retry_delays(statuses, ...)`: walk a sequence of response statuses and
  return the delay before each retry. A `Retry-After` from the server always
  wins — it is the only real information you have about when capacity returns.

setup_code: |
  import random
  import statistics

  BASE = 200
  CAP = 30_000

  # Statuses a client might see, in order, ending in success.
  SEQUENCE = [
      {"status": 429, "retry_after_ms": 1500},
      {"status": 503},
      {"status": 503},
      {"status": 200},
  ]

starter_code: |
  def delay_ms(attempt, base=BASE, cap=CAP, rng=random):
      """Wait before retry number `attempt` (1-based)."""
      bound = min(cap, base * 2 ** (attempt - 1))
      return bound


  def retry_delays(sequence, base=BASE, cap=CAP, rng=random):
      """Delays before each retry. A server's retry_after_ms overrides ours."""
      out = []
      attempt = 0
      for response in sequence:
          if response["status"] == 200:
              break
          attempt += 1
          out.append(delay_ms(attempt, base, cap, rng))
      return out


  r = random.Random(7)
  print("delays  ", [round(delay_ms(a, rng=r)) for a in range(1, 6)])
  print("sequence", [round(d) for d in retry_delays(SEQUENCE, rng=random.Random(7))])

tests: |
  rng = random.Random(20260809)

  # The bound doubles; the delay is somewhere inside it.
  for attempt in range(1, 8):
      bound = min(CAP, BASE * 2 ** (attempt - 1))
      for _ in range(50):
          d = delay_ms(attempt, rng=rng)
          assert 0 <= d <= bound, f"attempt {attempt}: delay {d} outside [0, {bound}]"

  # It must actually be random, and spread across the whole interval.
  draws = [delay_ms(5, rng=rng) for _ in range(400)]
  bound = BASE * 2 ** 4
  assert len(set(draws)) > 100, (
      "delay_ms returned the same value every time. Without randomness, every "
      "client that collided retries at the same moment and collides again - "
      "which is the failure jitter exists to prevent."
  )
  assert min(draws) < 0.15 * bound and max(draws) > 0.85 * bound, (
      f"draws span [{min(draws):.0f}, {max(draws):.0f}] of a {bound} bound. Full "
      "jitter is uniform over the entire interval; a narrow band around the "
      "bound is still a common value."
  )
  assert abs(statistics.fmean(draws) - bound / 2) < 0.12 * bound, (
      "the mean of a uniform draw on [0, bound] should sit near bound/2"
  )

  # The cap holds however many attempts have gone by.
  assert all(delay_ms(20, rng=rng) <= CAP for _ in range(50))

  # A server that tells you when to come back is obeyed exactly.
  delays = retry_delays(SEQUENCE, rng=random.Random(1))
  assert len(delays) == 3, f"three failures before the 200, got {len(delays)} delays"
  assert delays[0] == 1500, (
      f"first delay was {delays[0]:.0f}, expected exactly 1500. The 429 carried "
      "retry_after_ms; that is the only reliable information you have about when "
      "capacity returns, and it beats any policy you could compute."
  )
  assert delays[1] != delays[2] or delays[1] == 0, (
      "the two 503s produced identical delays - the jitter is not being applied "
      "to them"
  )
  for d, attempt in zip(delays[1:], (2, 3)):
      assert 0 <= d <= min(CAP, BASE * 2 ** (attempt - 1))

  # Nothing to retry when the first call succeeds.
  assert retry_delays([{"status": 200}]) == []

hints:
  - "`delay_ms` currently returns the bound itself. It should return a random value between 0 and the bound."
  - "`rng.uniform(0, bound)` — the whole interval, not a band around the top of it."
  - "In `retry_delays`, check for `retry_after_ms` in the response and use it instead of your computed delay when it is present."

solution: |
  def delay_ms(attempt, base=BASE, cap=CAP, rng=random):
      bound = min(cap, base * 2 ** (attempt - 1))
      return rng.uniform(0, bound)


  def retry_delays(sequence, base=BASE, cap=CAP, rng=random):
      out = []
      attempt = 0
      for response in sequence:
          if response["status"] == 200:
              break
          attempt += 1
          server_says = response.get("retry_after_ms")
          if server_says is not None:
              out.append(float(server_says))
          else:
              out.append(delay_ms(attempt, base, cap, rng))
      return out


  r = random.Random(7)
  print("delays  ", [round(delay_ms(a, rng=r)) for a in range(1, 6)])
  print("sequence", [round(d) for d in retry_delays(SEQUENCE, rng=random.Random(7))])
