id: tok-l3-trim
title: "Trim the history without breaking it"
lesson: modules/01-tokens/03-context-windows
description: |
  The conversation no longer fits. Something has to go, and *which* something
  is a policy decision with three invariants:

  1. **The system message stays.** Dropping it removes the instructions while
     the request still succeeds — the assistant's behaviour changes and
     nothing in the logs says why.
  2. **The kept history starts with a user message.** A transcript beginning
     with an assistant reply implies a question the model can no longer see,
     and it will sometimes answer the imagined one.
  3. **Keep as much recent history as fits.** Drop from the oldest end.

  If not even the system message plus the final user message fits, **raise
  `ValueError`** rather than returning something that cannot be sent.

setup_code: |
  TEMPLATE_OVERHEAD = 4
  GENERATION_PROMPT = 3

  def msg(role, tokens):
      return {"role": role, "content": f"<{role}>", "tokens": tokens}

  def prompt_tokens(messages):
      """Total tokens in the rendered request: content, plus TEMPLATE_OVERHEAD
      per message, plus GENERATION_PROMPT once. This is lesson 1.3's
      accounting, already correct - you are not asked to change it."""
      return sum(m["tokens"] + TEMPLATE_OVERHEAD for m in messages) + GENERATION_PROMPT

  def roles(messages):
      """The role of each message, in order - handy for printing a result."""
      return [m["role"] for m in messages]

  # system 20 | u30 a50 u30 a50 u30  ->  237 tokens in full
  CONVO = [msg("system", 20),
           msg("user", 30), msg("assistant", 50),
           msg("user", 30), msg("assistant", 50),
           msg("user", 30)]

provided:
  CONVO:
    summary: >-
      A six-message conversation — system, then five alternating user and
      assistant turns — costing 237 tokens in full.
    notes:
      - "Content sizes are 20 / 30 / 50 / 30 / 50 / 30 tokens in order."

starter_code: |
  def trim_history(messages, budget):
      """Return the longest suffix of history that fits, keeping the system message."""
      out = list(messages)
      while out and prompt_tokens(out) > budget:
          out.pop(0)
      return out


  for b in (300, 200, 100):
      kept = trim_history(CONVO, b)
      print(f"budget {b:>3}: {prompt_tokens(kept):>3} tokens  {roles(kept)}")

tests: |
  # Nothing to do when it already fits.
  kept = trim_history(CONVO, 300)
  assert kept == CONVO, "a conversation that fits must be returned unchanged"

  # Tight budget: the two oldest messages go, and the system message does not.
  kept = trim_history(CONVO, 200)
  assert prompt_tokens(kept) <= 200, f"result is {prompt_tokens(kept)} tokens, over budget"
  assert roles(kept)[0] == "system", (
      f"the trimmed conversation starts with {roles(kept)[0]!r}. The system "
      "message carries the instructions; dropping it leaves a request that still "
      "succeeds and no longer says what the assistant is supposed to do."
  )
  assert roles(kept)[1] == "user", (
      f"history begins with {roles(kept)[1]!r}. A transcript that opens with an "
      "assistant reply implies a question the model cannot see, and it will "
      "sometimes answer the one it imagines."
  )
  assert roles(kept) == ["system", "user", "assistant", "user"], f"got {roles(kept)}"
  assert kept[-1] is CONVO[-1], "the most recent message must always be kept"

  # Tighter still: only the last exchange survives.
  kept = trim_history(CONVO, 100)
  assert roles(kept) == ["system", "user"], f"got {roles(kept)}"
  assert prompt_tokens(kept) == 61

  # It must keep as much as fits, not merely something that fits.
  kept = trim_history(CONVO, 160)
  assert roles(kept) == ["system", "user", "assistant", "user"], (
      f"got {roles(kept)}: at a budget of 160 the four-message form costs 149 and "
      "fits, so trimming further throws away context you were entitled to keep"
  )

  # Impossible budgets must be refused, not approximated.
  try:
      trim_history(CONVO, 50)
  except ValueError:
      pass
  else:
      raise AssertionError(
          "a budget of 50 cannot hold the system message plus the final user "
          "message (61 tokens). Returning a shorter conversation would mean "
          "dropping the system message or the user's actual question; the only "
          "honest answer is to raise."
      )

  # A conversation with no system message still works.
  no_system = CONVO[1:]
  kept = trim_history(no_system, 120)
  assert roles(kept)[0] == "user" and prompt_tokens(kept) <= 120

hints:
  - "Split the list first: the system message (if there is one) and the rest."
  - "Candidate results are the suffixes of the history that begin at a `user` message. Try the longest first and return the first one that fits."
  - "If no candidate fits — not even the last user message alone — raise ValueError."

solution: |
  def trim_history(messages, budget):
      system = [m for m in messages[:1] if m["role"] == "system"]
      history = messages[len(system):]

      for i in range(len(history)):
          if history[i]["role"] != "user":
              continue
          candidate = system + history[i:]
          if prompt_tokens(candidate) <= budget:
              return candidate

      raise ValueError(
          f"cannot fit the system message plus the final user message in {budget} tokens"
      )


  for b in (300, 200, 100):
      kept = trim_history(CONVO, b)
      print(f"budget {b:>3}: {prompt_tokens(kept):>3} tokens  {roles(kept)}")
