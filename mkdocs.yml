site_name: LLM Systems for Data Scientists
site_description: >-
  An interactive, project-based path from data science to LLM systems:
  tokens, prompting, retrieval, agents, transformer internals, training and
  adaptation, serving infrastructure, and evaluation that catches real
  regressions.
repo_url: https://github.com/paulyonghaoli/llm-systems-for-data-scientists
repo_name: llm-systems-for-data-scientists

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

hooks:
  - tools/mkdocs_hooks.py

extra_css:
  - stylesheets/interactive.css
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js
  - javascripts/interactive.js
  - javascripts/progress.js

nav:
  - Home: index.md
  - Curriculum map: curriculum.md
  - "Pinned versions (living doc)": living/models.md
  - Glossary: glossary.md
  - "My progress": progress.md
  - "Module 0 · From data science to LLM systems":
      - Overview: modules/00-transition/index.md
      - "0.1 What changes when the model is someone else's": modules/00-transition/01-what-changes.md
      - "0.2 Anatomy of an LLM application": modules/00-transition/02-anatomy.md
      - "0.3 Why your evaluation habits break": modules/00-transition/03-evaluation-breaks.md
      - "0.4 Cost and latency are features": modules/00-transition/04-cost-and-latency.md
      - "0.5 Lab: the demo that worked": modules/00-transition/05-lab-demo-that-worked.md
      - "Mini-project 0: the reliability report": modules/00-transition/project-reliability.md
      - "Appendix: who does what": modules/00-transition/roles.md
  - "Module 1 · Tokens & the API contract":
      - Overview: modules/01-tokens/index.md
      - "1.1 Tokens are not words: BPE from scratch": modules/01-tokens/01-bpe.md
      - "1.2 Sampling: temperature, top-k, top-p": modules/01-tokens/02-sampling.md
      - "1.3 Context windows and chat templates": modules/01-tokens/03-context-windows.md
      - "1.4 The API contract": modules/01-tokens/04-api-contract.md
      - "1.5 Costing a design before you build it": modules/01-tokens/05-costing-a-design.md
      - "Mini-project 1: the context packer": modules/01-tokens/project-tokenizer.md
  - "Module 2 · Prompting & structured output":
      - Overview: modules/02-prompting/index.md
      - "2.1 Instruction structure and the trust boundary": modules/02-prompting/01-instruction-structure.md
      - "2.2 Few-shot selection is a retrieval problem": modules/02-prompting/02-fewshot-selection.md
      - "2.3 Decomposition, chaining and self-consistency": modules/02-prompting/03-decomposition.md
      - "2.4 Structured output: schema, validation, repair": modules/02-prompting/04-structured-output.md
      - "2.5 Constrained decoding: the logit mask": modules/02-prompting/05-constrained-decoding.md
      - "Mini-project 2: the extraction harness": modules/02-prompting/project-extraction.md
  - "Module 3 · Embeddings, retrieval & RAG":
      - Overview: modules/03-retrieval/index.md
      - "3.1 Embedding geometry": modules/03-retrieval/01-embedding-geometry.md
      - "3.2 Exact and approximate search": modules/03-retrieval/02-exact-and-approximate.md
      - "3.3 BM25": modules/03-retrieval/03-bm25.md
      - "3.4 Hybrid retrieval and RRF": modules/03-retrieval/04-hybrid-fusion.md
      - "3.5 Chunking": modules/03-retrieval/05-chunking.md
